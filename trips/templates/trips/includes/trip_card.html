<article class="card trip-card mb-3">
    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
            <h2 class="card-title h5">
                {{ trip.name|default:"Без названия" }}
            </h2>
            <p class="card-text text-body-secondary mb-2">
                {{ trip.start_date|date:"d.m.Y" }} – {{ trip.end_date|date:"d.m.Y" }},
                {{ trip.duration }} дн.
            </p>
            <a href="{% url 'trips:detail' trip.id %}" class="btn btn-primary btn-sm">
                Подробнее
            </a>
        </div>
        {% include "trips/includes/budget_badge.html" %}
    </div>
</article>
