{% extends "base.html" %}

{% block title %}Поездки – Сервис расходов поездки{% endblock %}

{% block content %}
    <h1>Поездки</h1>
    <p class="text-body-secondary">Всего поездок: {{ trips|length }}</p>
    {% for trip in trips %}
        {% include "trips/includes/trip_card.html" %}
    {% empty %}
        <p>Поездок пока нет.</p>
    {% endfor %}
{% endblock %}
