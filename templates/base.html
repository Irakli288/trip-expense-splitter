{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис расходов поездки{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'homepage/img/logo.png' %}">
</head>
<body>
    {% include "includes/navigation.html" %}
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="container site-footer mt-4 mb-3">
        <p>© <span id="current-year"></span> Сервис распределения расходов поездки</p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
